sources:
  simplify:
    enabled: true
    new_grad_repo: SimplifyJobs/New-Grad-Positions
    intern_repo: SimplifyJobs/Summer2027-Internships   # update when the season rolls over
    categories: [Software, Software Engineering, AI/ML/Data]
  canada_internship:
    enabled: true            # applies to the Canada region only
  jsearch:
    enabled: true            # Notion + Discord only, never on the public board
    run_hour: 12             # weekdays at this hour, Toronto time (free quota: 200/month)

tracks:
  intern:
    queries:                 # JSearch only
      - software developer intern
      - software engineer intern
      - software developer co-op
  new_grad:
    queries:
      - new grad software engineer
      - junior software developer
      - associate software engineer
      - entry level software developer

# A title must contain at least one of these role words (whole-word, case-insensitive).
include_title_keywords: [
  software, developer, developers, development, programmer, programming, coding,
  engineer, engineers, engineering, ingenierie, ingénierie,
  développeur, developpeur, développement, developpement, logiciel, logiciels,
  devops, mlops, sre, full stack, full-stack, fullstack, frontend, front-end, front end,
  backend, back-end, back end, web, mobile, ios, android, cloud, platform, infrastructure,
  computer, automation,
  data, données, donnees, analytics, machine learning, ml, ai, genai, llm, nlp,
  artificial intelligence, intelligence artificielle, deep learning, computer vision,
  research, researcher, scientist, science,
  qa, quality assurance, test, testing, tester,
]

# Titles containing any of these are dropped, even if they match an include word.
exclude_title_keywords: [
  senior, sr., staff, principal, lead, manager, director,
  language specialist, ai trainer, rater, annotator,
  business analyst, business analytics, business intelligence, business development,
  business advisor, business partner, business strategy, business operations,
  marketing, sales strategy, sales representative, banking, coordinator, consulting,
  information technology, technologie de l'information, network analyst, systems analyst,
  help desk, service desk, it support, technical support, desktop support,
  hardware, fpga, asic, firmware, mechanical, electrical, mechatronics, manufacturing, physical design,
  silicon, civil, chemical, automotive, controls engineer, power system, pipeline, field engineering,
  certification, hvp, procedes, desktop, networking, network systems,
]

regions:
  canada:
    country: ca
    enabled: true
    notify: true
    publish: true            # include in the public board
    notion_db_env: NOTION_DB_CANADA
    discord_webhook_env: DISCORD_WEBHOOK_CANADA
  usa:
    country: us
    enabled: false
    notify: false
    publish: false
    notion_db_env: NOTION_DB_USA
    discord_webhook_env: DISCORD_WEBHOOK_USA
