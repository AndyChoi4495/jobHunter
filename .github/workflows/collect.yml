name: collect

on:
  schedule:
    - cron: "17 11 * * *"
    - cron: "17 23 * * *"
    # Weekday noon runs for JSearch. Cron is UTC with no DST, so both 16:05 and 17:05 are
    # scheduled; main.py only calls JSearch in the one that lands in 12:xx Toronto time.
    - cron: "5 16 * * 1-5"
    - cron: "5 17 * * 1-5"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      # If this step fails (e.g. a source fetch error), the deploy job is skipped so a partial board never replaces the live one.
      - run: python -m jobhunter.main
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_CANADA: ${{ secrets.NOTION_DB_CANADA }}
          DISCORD_WEBHOOK_CANADA: ${{ secrets.DISCORD_WEBHOOK_CANADA }}
          NOTION_DB_USA: ${{ secrets.NOTION_DB_USA }}
          DISCORD_WEBHOOK_USA: ${{ secrets.DISCORD_WEBHOOK_USA }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
